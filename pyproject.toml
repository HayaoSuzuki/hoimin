[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "hoimin"
version = "0.1.0"
description = "Bounded mutation testing for focused Python changes"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["libcst>=1.8.6,<2"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/hoimin-cli/Cargo.toml"
