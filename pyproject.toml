[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "hoimin"
version = "0.1.0"
description = "Bounded mutation testing for focused Python changes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = ["libcst>=1.8.6,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/HayaoSuzuki/hoimin"

[dependency-groups]
dev = [
    "hypothesis>=6.110,<7",
    "maturin>=1.11,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "pytest-randomly>=4.0,<5",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["python/tests", "tests"]
norecursedirs = ["tests/fixtures"]
python_files = ["test_*.py", "*_test.py", "wheel_smoke.py"]
addopts = "-ra --randomly-seed=last --cov=python --cov=tests --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = false
parallel = true
patch = ["subprocess"]
source = ["python", "tests"]
omit = [
    "python/tests/fixtures/*",
    "tests/fixtures/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "D203", # Incompatible with D211.
    "D213", # Incompatible with D212.
]

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["ANN", "D", "INP001", "PLR2004", "S101"]
"tests/**" = ["ANN", "D", "INP001", "PLR2004", "S101", "SLF001"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/hoimin-cli/Cargo.toml"
