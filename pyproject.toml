[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "hoimin"
version = "0.14.0"
description = "Mutation Testing CLI, Designed for AI Agents"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE", "vendor/ruff_python_parser/LICENSE"]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/HayaoSuzuki/hoimin"
Issues = "https://github.com/HayaoSuzuki/hoimin/issues"
Changelog = "https://github.com/HayaoSuzuki/hoimin/releases"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/hoimin-cli/Cargo.toml"
# Keep the vendored build/provenance inputs explicit; exclude caches and outputs.
include = [
    { path = "vendor/ruff_python_parser/Cargo.toml", format = "sdist" },
    { path = "vendor/ruff_python_parser/LICENSE", format = "sdist" },
    { path = "vendor/ruff_python_parser/README.hoimin.md", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/ast_cleanup.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/error.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/lexer.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/lexer/cursor.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/lexer/indentation.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/lexer/interpolated_string.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/lib.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/expression.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/helpers.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/mod.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/options.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/pattern.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/progress.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/recovery.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/parser/statement.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/semantic_errors.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/string.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/token.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/token_set.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/token_source.rs", format = "sdist" },
    { path = "vendor/ruff_python_parser/src/typing.rs", format = "sdist" },
]

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "internal-tooling"},
    {include-group = "provenance"},
    "hypothesis==6.170.0",
    "jsonschema==4.26.0",
    "maturin>=1.11,<2",
    "mypy>=2.3.0",
    "packaging>=26.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-randomly>=5,<6",
    "pyyaml>=6.0.2,<7",
    "ruff>=0.17,<0.18",
    "ty>=0.0.80",
]
provenance = [
    {include-group = "internal-tooling"},
    "pypi-attestations==0.0.30",
]
internal-tooling = [
    "returns==0.29.0",
    "deal==4.24.6",
]
fuzz = [
    "hypothesis==6.170.0",
    "hypothesmith==0.3.3",
]
workflow = [
    "actionlint-py==1.7.12.25",
    "shellcheck-py==0.11.0.1",
    "zizmor==1.30.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pytest>=9,<10",
]

[tool.ruff]
target-version = "py314"
line-length = 88
force-exclude = true
extend-exclude = [
    ".worktrees",
    "docs",
    "target",
    "vendor",
    "tests/fixtures",
    "crates/hoimin-cli/tests/fixtures",
]

[tool.ruff.per-file-target-version]
# The proof runner executes in the pinned Python 3.12 tool image.
"tools/verify_creusot.py" = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A003", "COM812", "CPY001", "D", "ERA001", "ISC001", "PLC2401",
    "PLC2403", "RUF001", "S101", "SIM103", "TC001", "TC002", "TC003", "UP040",
]
fixable = ["ALL"]
unfixable = ["ERA001", "F401"]
allowed-confusables = ["ノ"]

[tool.ruff.lint.per-file-ignores]
# These are standalone scripts/test modules, not importable Python packages.
"tests/*.py" = ["INP001"]
# Literal expected values keep test assertions readable.
"tests/test_*.py" = ["PLR2004"]
"tools/*.py" = ["INP001"]
"formal/HoiminOracle/tools/*.py" = ["INP001"]
"crates/hoimin-cli/tests/support/*.py" = ["INP001"]

[tool.pytest.ini_options]
minversion = "9.0"
strict = true
empty_parameter_set_mark = "fail_at_collect"
testpaths = ["tests"]
norecursedirs = ["fixtures", ".hypothesis"]
pythonpath = [".", "tests"]

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"
extra-paths = ["tests"]

[tool.ty.src]
include = ["tools", "tests", "formal/HoiminOracle/tools", "crates/hoimin-cli/tests/support"]
exclude = ["tests/fixtures", "crates/hoimin-cli/tests/fixtures"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true
