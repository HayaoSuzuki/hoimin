[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "hoimin"
version = "0.1.0"
description = "Bounded mutation testing for focused Python changes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/tokyogas-tech/hoimin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/hoimin-cli/Cargo.toml"

[dependency-groups]
dev = [
    "maturin>=1.11,<2",
    "mypy>=2.3.0",
    "packaging>=26.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-randomly>=5,<6",
    "pyyaml>=6.0.2,<7",
    "ruff>=0.16.1,<0.17",
    "ty>=0.0.61",
]
fuzz = [
    "hypothesis>=6.93,<7",
    "hypothesmith==0.3.3",
]

[tool.ruff]
target-version = "py314"
line-length = 88
force-exclude = true
extend-exclude = [
    ".worktrees",
    "docs",
    "target",
    "vendor",
    "tests/fixtures",
    "crates/hoimin-cli/tests/fixtures",
]

[tool.ruff.lint]
select = ["ALL"]
# Match kraken-hub's applicable policy; omit its Django-specific exceptions.
ignore = [
    "A003", "COM812", "CPY001", "D", "ERA001", "ISC001", "PLC2401",
    "PLC2403", "RUF001", "S101", "SIM103", "TC001", "TC002", "TC003", "UP040",
]
fixable = ["ALL"]
unfixable = ["ERA001", "F401"]
allowed-confusables = ["ノ"]

[tool.ruff.lint.per-file-ignores]
# These are standalone scripts/test modules, not importable Python packages.
"tests/*.py" = ["INP001"]
"tools/*.py" = ["INP001"]
"formal/HoiminOracle/tools/*.py" = ["INP001"]
"crates/hoimin-cli/tests/support/*.py" = ["INP001"]
# Preserve existing unittest assertions while pytest supplies collection/execution.
"tests/test_*.py" = ["PT009", "PT027"]

[tool.pytest.ini_options]
minversion = "9.0"
strict = true
empty_parameter_set_mark = "fail_at_collect"
testpaths = ["tests"]
norecursedirs = ["fixtures", ".hypothesis"]
pythonpath = [".", "tests"]
