[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "hoimin"
version = "0.14.0"
description = "Mutation Testing CLI, Designed for AI Agents"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE", "vendor/ruff_python_parser/LICENSE"]
requires-python = ">=3.14,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/HayaoSuzuki/hoimin"
Issues = "https://github.com/HayaoSuzuki/hoimin/issues"
Changelog = "https://github.com/HayaoSuzuki/hoimin/releases"

