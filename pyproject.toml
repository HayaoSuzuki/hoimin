[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "hoimin"
version = "0.1.0"
description = "Bounded mutation testing for focused Python changes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/tokyogas-tech/hoimin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/hoimin-cli/Cargo.toml"

[dependency-groups]
dev = [
    "maturin>=1.11,<2",
    "mypy>=2.3.0",
    "ty>=0.0.61",
]
