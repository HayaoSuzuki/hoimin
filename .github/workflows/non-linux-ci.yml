name: Manual non-Linux CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-linux-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  quality:
    name: Manual quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --group fuzz --no-install-project
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync ruff check --no-fix .
      - run: uv run --frozen --no-sync ty check
      - name: Release SBOM generative tests
        run: uv run --frozen --no-sync pytest tests/test_sbom_properties.py tests/test_sbom_oracle.py
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/ruff_python_parser/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p ruff_python_parser --lib --no-deps -- -D warnings

  rust:
    name: Manual Rust (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        python: ['3.14', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      # Run publication/initialization on both native platforms before the
      # longer workspace suite, so its result can be inspected independently.
      - name: Test completed review-store publication
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo test --locked -p hoimin-cli --lib review::store_tests -- --test-threads=2
      - name: Test session database admission
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo test --locked -p hoimin-cli --lib session::schema::tests -- --test-threads=2
      # Native Job Object fixtures retain their six-second shared deadline.
      # Bound harness contention during interpreter startup on Windows runners.
      - name: Test Windows workspace with two harness threads
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --test-threads=2
      - run: cargo test --workspace
        if: runner.os != 'Windows'
      - name: Show native Windows disk-name acceptance
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          RUST_TEST_THREADS: '2'
        run: cargo test --locked -p hoimin-cli --lib workspace::disk::native_name_tests -- --nocapture
      - run: cargo test --locked -p hoimin-cli --example generate_cli_reference
      - name: Check generated CLI reference
        run: cargo run --locked -p hoimin-cli --example generate_cli_reference -- --check
      - name: Performance shape gates
        shell: bash
        run: python tools/performance_shapes.py gate --output "$RUNNER_TEMP/performance-gates"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: performance-gates-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/performance-gates
      - run: uv run --frozen pytest tests/test_skills.py

  core-dependency-purity:
    name: Manual core dependency purity (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Reject I/O dependencies in hoimin-core
        shell: bash
        run: |
          cargo tree -p hoimin-core --edges normal --prefix none > core-tree.txt
          ! grep -E '(^| )(tokio|rusqlite|tempfile|windows-sys|libc|hoimin-cli)( |$)' core-tree.txt

  wheel-smoke:
    name: Manual wheel smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv run --frozen pytest
      - name: Reset wheel artifact directory
        run: python -c "import shutil; shutil.rmtree('target/wheels', ignore_errors=True)"
      - run: uvx maturin build --release
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - run: uv run --no-project --python 3.15 --with packaging==26.0 python tests/wheel_smoke.py

  windows-metrics-destinations:
    name: Manual Windows metrics destinations
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HOIMIN_REQUIRE_WINDOWS_SYMLINKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo clippy -p hoimin-cli --lib --test metrics_destinations --all-features -- -D warnings
      - run: cargo test -p hoimin-cli --all-features --lib metrics_destination::tests -- --nocapture
      - run: cargo test -p hoimin-cli --all-features --test metrics_destinations -- --nocapture

  windows-resource-scope:
    name: Manual Windows resource scope
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo clippy -p hoimin-cli --lib --test process_handler --test windows_resource_scope --all-features -- -D warnings
      - run: cargo test -p hoimin-cli --all-features --lib resource::windows::tests -- --nocapture
      - run: cargo test -p hoimin-cli --all-features --test process_handler job_object -- --nocapture
      - run: cargo test -p hoimin-cli --all-features --test windows_resource_scope -- --nocapture
