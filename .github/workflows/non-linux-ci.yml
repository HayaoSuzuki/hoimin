name: Manual non-Linux CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Manual quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/ruff_python_parser/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p littrs-ruff-python-parser --lib --no-deps -- -D warnings

  rust:
    name: Manual Rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo test --workspace
      - run: cargo test -p hoimin-cli --test run_e2e
      - name: Performance shape gates
        run: python tools/performance_shapes.py gate --output "${{ runner.temp }}/performance-gates"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-gates-${{ matrix.os }}
          path: ${{ runner.temp }}/performance-gates
      - run: uv run --frozen python -m unittest tests/test_skills.py

  core-dependency-purity:
    name: Manual core dependency purity (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Reject I/O dependencies in hoimin-core
        shell: bash
        run: |
          cargo tree -p hoimin-core --edges normal --prefix none > core-tree.txt
          ! grep -E '(^| )(tokio|rusqlite|tempfile|windows-sys|libc|hoimin-cli)( |$)' core-tree.txt

  wheel-smoke:
    name: Manual wheel smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reset wheel artifact directory
        run: python -c "import shutil; shutil.rmtree('target/wheels', ignore_errors=True)"
      - run: uvx maturin build --release
      - run: uv run --frozen python tests/wheel_smoke.py

  windows-metrics-destinations:
    name: Manual Windows metrics destinations
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HOIMIN_REQUIRE_WINDOWS_SYMLINKS: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo clippy -p hoimin-cli --lib --test metrics_destinations --all-features -- -D warnings
      - run: cargo test -p hoimin-cli --all-features --lib metrics_destination::tests -- --nocapture
      - run: cargo test -p hoimin-cli --all-features --test metrics_destinations -- --nocapture

  windows-resource-scope:
    name: Manual Windows resource scope
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo clippy -p hoimin-cli --lib --test process_handler --test windows_resource_scope --all-features -- -D warnings
      - run: cargo test -p hoimin-cli --all-features --lib resource::windows::tests -- --nocapture
      - run: cargo test -p hoimin-cli --all-features --test process_handler job_object -- --nocapture
      - run: cargo test -p hoimin-cli --all-features --test windows_resource_scope -- --nocapture
