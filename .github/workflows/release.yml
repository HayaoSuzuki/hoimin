name: Release wheels

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Require the tag to match package metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c "import os, pathlib, tomllib; py=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; cargo=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']; tag=os.environ['TAG']; assert tag == f'v{py}' == f'v{cargo}', (tag, py, cargo)"

  windows-wheel:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --compatibility pypi --no-default-features
          maturin-version: v1.14.1
          target: x86_64-pc-windows-msvc
      - run: uv run --frozen python tests/wheel_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows-x86_64
          path: target/wheels/*.whl

  linux-wheel:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --compatibility pypi --no-default-features
          maturin-version: v1.14.1
          target: x86_64-unknown-linux-gnu
          manylinux: '2014'
      - run: uv run --frozen python tests/wheel_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-x86_64
          path: target/wheels/*.whl
