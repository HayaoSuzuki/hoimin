name: Build and release

on:
  pull_request:
    branches: [main]
  # Only the merged base-branch commit is checked out with write permission.
  pull_request_target:
    branches: [main]
    types: [closed]
  # Manual runs validate packages without reserving tags or publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Different merges must not cancel each other's pending releases.
  group: release-${{ github.event_name }}-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Reserve release tag or choose preview version
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            tag=$(python tools/release.py tag --commit "$COMMIT")
            if [[ -z "$tag" ]]; then
              PUBLISH=false
            fi
          else
            base=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            tag="v${base}-dev.${GITHUB_RUN_ID}"
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "commit=$COMMIT"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  windows-wheel:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set release version in manifests and lockfiles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python tools/release.py set-version "$VERSION"
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Build standalone executable
        run: cargo build --release --locked --no-default-features --bin hoimin --target x86_64-pc-windows-msvc --target-dir target/standalone
      - name: Verify standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY: target/standalone/x86_64-pc-windows-msvc/release/hoimin.exe
        shell: python
        run: |
          import os, subprocess
          binary = os.environ['BINARY']
          result = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30)
          assert result.stdout.strip() == 'hoimin ' + os.environ['VERSION'], result.stdout
          subprocess.run([binary, '--help'], check=True, timeout=30)
      - name: Build wheel
        env:
          MATURIN_VERSION: "1.15.0"
        shell: bash
        run: |
          uvx --from "maturin==$MATURIN_VERSION" maturin build \
            --release --locked --compatibility pypi --no-default-features \
            --target x86_64-pc-windows-msvc
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - name: Package verified binaries and wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          python tools/release.py package --binary target/standalone/x86_64-pc-windows-msvc/release/hoimin.exe
          --platform windows-x86_64 --version "$VERSION" --directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux-wheel:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set release version in manifests and lockfiles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python tools/release.py set-version "$VERSION"
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Build standalone executable
        run: cargo build --release --locked --no-default-features --bin hoimin --target x86_64-unknown-linux-gnu --target-dir target/standalone
      - name: Verify standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY: target/standalone/x86_64-unknown-linux-gnu/release/hoimin
        shell: python
        run: |
          import os, subprocess
          binary = os.environ['BINARY']
          result = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30)
          assert result.stdout.strip() == 'hoimin ' + os.environ['VERSION'], result.stdout
          subprocess.run([binary, '--help'], check=True, timeout=30)
      - name: Build wheel
        env:
          MATURIN_VERSION: "1.15.0"
        shell: bash
        run: |
          # Build in manylinux2014; host builds link against Ubuntu's newer glibc.
          # Keep container-owned Cargo outputs separate from subsequent host builds.
          docker run --rm --volume "$PWD:/io" --workdir /io \
            --env CARGO_TARGET_DIR=/tmp/hoimin-wheel-target \
            ghcr.io/pyo3/maturin:v"$MATURIN_VERSION" \
            build --release --locked --compatibility manylinux2014 \
            --no-default-features --target x86_64-unknown-linux-gnu --out target/wheels
          sudo chown -R "$(id -u):$(id -g)" target/wheels
          # --rm removes the build container, but the large manylinux image remains.
          # Reclaim it before smoke tests without lowering hoimin's 10 GiB reserve.
          docker image rm ghcr.io/pyo3/maturin:v"$MATURIN_VERSION"
          df -h . /tmp
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - name: Package verified binaries and wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          python tools/release.py package --binary target/standalone/x86_64-unknown-linux-gnu/release/hoimin
          --platform linux-x86_64 --version "$VERSION" --directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos-wheel:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set release version in manifests and lockfiles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python tools/release.py set-version "$VERSION"
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Build standalone executable
        run: cargo build --release --locked --no-default-features --bin hoimin --target aarch64-apple-darwin --target-dir target/standalone
      - name: Verify standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY: target/standalone/aarch64-apple-darwin/release/hoimin
        shell: python
        run: |
          import os, subprocess
          binary = os.environ['BINARY']
          result = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30)
          assert result.stdout.strip() == 'hoimin ' + os.environ['VERSION'], result.stdout
          subprocess.run([binary, '--help'], check=True, timeout=30)
      - name: Build wheel
        env:
          MATURIN_VERSION: "1.15.0"
        shell: bash
        run: |
          uvx --from "maturin==$MATURIN_VERSION" maturin build \
            --release --locked --compatibility pypi --no-default-features \
            --target aarch64-apple-darwin
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - name: Package verified binaries and wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          python tools/release.py package --binary target/standalone/aarch64-apple-darwin/release/hoimin
          --platform macos-aarch64 --version "$VERSION" --directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-aarch64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, windows-wheel, linux-wheel, macos-wheel]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Require all platforms and write checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python tools/release.py checksums --directory dist --version "$VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ $(python -c 'import json; print(json.load(open("release-state.json"))["isDraft"])') == False ]]; then
              echo "Release $TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "hoimin $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          # Let GitHub select Latest by version/date, not this run's finish order.
          # A client-side read/compare followed by --latest=true would race.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy
