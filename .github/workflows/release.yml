name: Build and release

# Closed/merged event; write jobs check out only merge_commit_sha, never PR head.
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    branches: [main]
  # Only the merged base-branch commit is checked out with write permission.
  pull_request_target:
    branches: [main]
    types: [closed]
  # Manual runs validate packages without reserving tags or publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR previews cancel only older previews of the same PR.
  # The existing per-merge group is retained for publication.
  group: release-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      distribution: ${{ steps.plan.outputs.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Select preview inputs
        id: plan
        run: python tools/ci_selection.py plan

  reserve:
    name: Reserve release tag
    needs: changes
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Reserve release tags / publish validated assets.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Only merged base-branch code is executed with a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          # Required only to push the reserved tag for merged base-branch code.
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Reserve release tag
        id: tag
        env:
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag=$(python tools/release.py tag --commit "$COMMIT")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare packages
    needs: [changes, reserve]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      ((github.event_name != 'pull_request_target' && needs.changes.outputs.distribution == 'true') ||
       (needs.reserve.result == 'success' && needs.reserve.outputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # PR payload merge_commit_sha can lag behind a synchronize event.
      # Only post-merge publication uses it; previews use the event commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Reserve release tag or choose preview version
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true }}
          COMMIT: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
          RESERVED_TAG: ${{ needs.reserve.outputs.tag }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            tag="$RESERVED_TAG"
          else
            base=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            tag="v${base}-dev.${GITHUB_RUN_ID}"
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "commit=$COMMIT"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  windows-wheel:
    name: Windows wheel
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set release version in manifests and lockfiles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python tools/release.py set-version "$VERSION"
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Install pinned SBOM generator
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked --root "$RUNNER_TEMP/sbom-tools"
      - name: Build standalone executable
        run: cargo build --release --locked --no-default-features --bin hoimin --target x86_64-pc-windows-msvc --target-dir target/standalone
      - name: Verify standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY: target/standalone/x86_64-pc-windows-msvc/release/hoimin.exe
        shell: python
        run: |
          import os, subprocess
          binary = os.environ['BINARY']
          result = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30)
          assert result.stdout.strip() == 'hoimin ' + os.environ['VERSION'], result.stdout
          subprocess.run([binary, '--help'], check=True, timeout=30)
      - name: Build wheel
        env:
          MATURIN_VERSION: "1.15.0"
        shell: bash
        run: |
          uvx --from "maturin==$MATURIN_VERSION" maturin build \
            --release --locked --compatibility pypi --no-default-features \
            --target x86_64-pc-windows-msvc
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - name: Package verified binaries and wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          python tools/release.py package --binary target/standalone/x86_64-pc-windows-msvc/release/hoimin.exe
          --platform windows-x86_64 --version "$VERSION" --directory dist
      - name: Generate and validate release SBOMs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          sbom_bin="$(cygpath -u "$RUNNER_TEMP")/sbom-tools/bin"
          export PATH="$sbom_bin:$PATH"
          python tools/capture_sbom.py --target x86_64-pc-windows-msvc --output target/sbom/standalone.json
          python tools/capture_sbom.py --target x86_64-pc-windows-msvc --output target/sbom/wheel.json
          for kind in standalone wheel; do
            uv run --frozen --no-sync python tools/sbom.py --raw "target/sbom/$kind.json" \
              --directory dist --platform windows-x86_64 --kind "$kind" \
              --version "$VERSION" --commit "$COMMIT"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux-wheel:
    name: Linux wheel
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set release version in manifests and lockfiles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python tools/release.py set-version "$VERSION"
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Install pinned SBOM generator
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked --root "$RUNNER_TEMP/sbom-tools"
      - name: Build standalone executable
        run: cargo build --release --locked --no-default-features --bin hoimin --target x86_64-unknown-linux-gnu --target-dir target/standalone
      - name: Verify standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY: target/standalone/x86_64-unknown-linux-gnu/release/hoimin
        shell: python
        run: |
          import os, subprocess
          binary = os.environ['BINARY']
          result = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30)
          assert result.stdout.strip() == 'hoimin ' + os.environ['VERSION'], result.stdout
          subprocess.run([binary, '--help'], check=True, timeout=30)
      - name: Build wheel
        env:
          MATURIN_VERSION: "1.15.0"
        shell: bash
        run: |
          # Build in manylinux2014; host builds link against Ubuntu's newer glibc.
          # Keep container-owned Cargo outputs separate from subsequent host builds.
          docker run --rm --volume "$PWD:/io" --workdir /io \
            --env CARGO_TARGET_DIR=/tmp/hoimin-wheel-target \
            --entrypoint /bin/bash ghcr.io/pyo3/maturin:v"$MATURIN_VERSION" -euc '
              maturin build --release --locked --compatibility manylinux2014 \
                --no-default-features --target x86_64-unknown-linux-gnu --out target/wheels
              cargo install cargo-cyclonedx --version 0.5.7 --locked --root /tmp/sbom-tools
              export PATH="/tmp/sbom-tools/bin:$PATH"
              python3 tools/capture_sbom.py --target x86_64-unknown-linux-gnu \
                --output target/sbom/wheel.json
            '
          sudo chown -R "$(id -u):$(id -g)" target/sbom
          sudo chown -R "$(id -u):$(id -g)" target/wheels
          # --rm removes the build container, but the large manylinux image remains.
          # Reclaim it before smoke tests without lowering hoimin's 10 GiB reserve.
          docker image rm ghcr.io/pyo3/maturin:v"$MATURIN_VERSION"
          df -h . /tmp
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - name: Package verified binaries and wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          python tools/release.py package --binary target/standalone/x86_64-unknown-linux-gnu/release/hoimin
          --platform linux-x86_64 --version "$VERSION" --directory dist
      - name: Generate and validate release SBOMs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/sbom-tools/bin:$PATH"
          python tools/capture_sbom.py --target x86_64-unknown-linux-gnu --output target/sbom/standalone.json
          for kind in standalone wheel; do
            uv run --frozen --no-sync python tools/sbom.py --raw "target/sbom/$kind.json" \
              --directory dist --platform linux-x86_64 --kind "$kind" \
              --version "$VERSION" --commit "$COMMIT"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos-wheel:
    name: macOS wheel
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set release version in manifests and lockfiles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python tools/release.py set-version "$VERSION"
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Install pinned SBOM generator
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked --root "$RUNNER_TEMP/sbom-tools"
      - name: Build standalone executable
        run: cargo build --release --locked --no-default-features --bin hoimin --target aarch64-apple-darwin --target-dir target/standalone
      - name: Verify standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY: target/standalone/aarch64-apple-darwin/release/hoimin
        shell: python
        run: |
          import os, subprocess
          binary = os.environ['BINARY']
          result = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30)
          assert result.stdout.strip() == 'hoimin ' + os.environ['VERSION'], result.stdout
          subprocess.run([binary, '--help'], check=True, timeout=30)
      - name: Build wheel
        env:
          MATURIN_VERSION: "1.15.0"
        shell: bash
        run: |
          uvx --from "maturin==$MATURIN_VERSION" maturin build \
            --release --locked --compatibility pypi --no-default-features \
            --target aarch64-apple-darwin
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py
      - name: Package verified binaries and wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          python tools/release.py package --binary target/standalone/aarch64-apple-darwin/release/hoimin
          --platform macos-aarch64 --version "$VERSION" --directory dist
      - name: Generate and validate release SBOMs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/sbom-tools/bin:$PATH"
          python tools/capture_sbom.py --target aarch64-apple-darwin --output target/sbom/standalone.json
          python tools/capture_sbom.py --target aarch64-apple-darwin --output target/sbom/wheel.json
          for kind in standalone wheel; do
            uv run --frozen --no-sync python tools/sbom.py --raw "target/sbom/$kind.json" \
              --directory dist --platform macos-aarch64 --kind "$kind" \
              --version "$VERSION" --commit "$COMMIT"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-aarch64
          path: dist/*
          if-no-files-found: error

  validate:
    name: Validate release assets
    needs: [prepare, windows-wheel, linux-wheel, macos-wheel]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-install-project
      - name: Require all platforms and write checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: uv run --frozen --no-sync python tools/release.py checksums --directory dist --version "$VERSION" --commit "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, validate]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Reserve release tags / publish validated assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-install-project
      - name: Require all platforms and write checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: uv run --frozen --no-sync python tools/release.py checksums --directory dist --version "$VERSION" --commit "$COMMIT"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ $(python -c 'import json; print(json.load(open("release-state.json"))["isDraft"])') == False ]]; then
              echo "Release $TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "hoimin $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          # Let GitHub select Latest by version/date, not this run's finish order.
          # A client-side read/compare followed by --latest=true would race.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy
