name: Publish wheels to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (vMAJOR.MINOR.PATCH, ELv2 only)
        type: string
        required: true
      index:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate PyPI wheels
    if: github.repository == 'HayaoSuzuki/hoimin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download and verify published release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$TAG^{commit}" HEAD
          gh release view "$TAG" --json tagName,isDraft,isPrerelease > release.json
          gh release download "$TAG" --pattern '*.whl' --pattern SHA256SUMS --dir release-assets
          python -m tools.pypi_release --tag "$TAG" --release-json release.json \
            --assets release-assets --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish PyPI wheels
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/p/hoimin' || 'https://test.pypi.org/p/hoimin' }}
    permissions:
      id-token: write # Trusted Publishing OIDC token; no source checkout here.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-wheels
          path: dist
      - name: Publish verified wheels
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          attestations: true
          print-hash: true
