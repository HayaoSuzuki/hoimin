name: Latest stable Rust canary

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-stable-canary-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  stable:
    name: Rust stable canary
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install latest stable Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: uv sync --frozen
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
      - name: Remove Clippy build artifacts
        run: cargo +stable clean
      - run: cargo +stable test --workspace
