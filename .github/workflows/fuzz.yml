name: Scheduled fuzzing

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing seconds per target
        type: choice
        options: ['30', '60', '300']
        default: '60'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Scheduled fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Start fuzz budget including setup
        run: echo "FUZZ_DEADLINE=$(( $(date +%s) + 3300 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - name: Cache cargo-fuzz executable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-fuzz-tool
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-0.13.2-nightly-2026-10-08
      - name: Install cargo-fuzz within remaining budget
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-fuzz-tool"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          if [[ ! -x "$tool_root/bin/cargo-fuzz" ]]; then
            remaining=$(( FUZZ_DEADLINE - $(date +%s) ))
            if (( remaining <= 0 )); then
              echo "Fuzz budget exhausted during setup" >&2
              exit 1
            fi
            timeout "${remaining}s" cargo +nightly-2026-10-08 install cargo-fuzz \
              --version 0.13.2 --locked --root "$tool_root"
          fi
      - name: Restore discovered corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Fuzz all targets
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '60' }}
        run: >-
          python tools/ci_fuzz.py
          --deadline "$FUZZ_DEADLINE"
          --report "$RUNNER_TEMP/fuzz-report"
          --seed "$GITHUB_RUN_ID"
          --seconds-per-target "$FUZZ_SECONDS"
      - name: Save discovered corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve fuzz diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz-report
            fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
