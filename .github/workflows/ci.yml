name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync ruff check --no-fix .
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/ruff_python_parser/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p littrs-ruff-python-parser --lib --no-deps -- -D warnings

  msrv:
    needs: quality
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-targets --all-features --locked

  rust:
    needs: quality
    name: Rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo test --workspace
      - run: cargo test -p hoimin-cli --test run_e2e
      - name: Performance shape gates
        run: python tools/performance_shapes.py gate --output "${{ runner.temp }}/performance-gates"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: performance-gates-${{ matrix.os }}
          path: ${{ runner.temp }}/performance-gates
      - run: uv run --frozen pytest tests/test_skills.py

  lean-audit:
    needs: quality
    name: Lean audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            formal/HoiminOracle/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/HoiminOracle/lean-toolchain', 'formal/HoiminOracle/lakefile.toml', 'formal/HoiminOracle/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if ! command -v elan >/dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --location \
              https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
              --output "$RUNNER_TEMP/elan.tar.gz"
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          fi
          elan run --install "$(cat formal/HoiminOracle/lean-toolchain)" lean --version
      - name: Run bounded Lean audit
        working-directory: formal/HoiminOracle
        shell: bash
        run: |
          set -euo pipefail
          stats_dir="$RUNNER_TEMP/lean-audit"
          mkdir -p "$stats_dir"

          run_guard() {
            local name="$1"
            shift
            python3 tools/lean_resource_guard.py \
              --timeout-seconds 30 \
              --rss-limit-mib 2048 \
              --sample-ms 250 \
              --stats "$stats_dir/$name.json" \
              -- "$@"
          }

          modules=(
            HoiminOracle.BindingFlowModel
            HoiminOracle.BoundedCandidateDiscoveryModel
            HoiminOracle.BudgetModel
            HoiminOracle.CandidateRankingModel
            HoiminOracle.CandidateSpanModel
            HoiminOracle.ChangedTargetModel
            HoiminOracle.ChangedContextModel
            HoiminOracle.CleanupCapabilityModel
            HoiminOracle.DiskGuardModel
            HoiminOracle.FactIndexModel
            HoiminOracle.Model
            HoiminOracle.MutationScoreExitPolicyModel
            HoiminOracle.OutputRetentionModel
            HoiminOracle.ProcessOutputModel
            HoiminOracle.ProgressDecisionModel
            HoiminOracle.ReportSequenceModel
            HoiminOracle.ResourceCleanupModel
            HoiminOracle.ResultLifecycleModel
            HoiminOracle.SchemaMigrationModel
            HoiminOracle.ScopeResolutionModel
            HoiminOracle.SessionModel
            HoiminOracle.ShutdownModel
            HoiminOracle.TimeoutLimitModel
            HoiminOracle.TopBudgetProjectionModel
            HoiminOracle.WorkspaceModel
            HoiminOracle.AnnotationScopeModel
            HoiminOracle.PreparedNamespaceModel
            HoiminOracle.BindingFlowProofs
            HoiminOracle.BoundedCandidateDiscoveryProofs
            HoiminOracle.BudgetProofs
            HoiminOracle.CandidateRankingProofs
            HoiminOracle.CandidateSpanProofs
            HoiminOracle.Cases
            HoiminOracle.ChangedTargetProofs
            HoiminOracle.ChangedContextProofs
            HoiminOracle.CleanupCapabilityProofs
            HoiminOracle.CompoundPatternGuardModel
            HoiminOracle.DiskGuardCases
            HoiminOracle.ExceptionMatchBindingModel
            HoiminOracle.FactIndexProofs
            HoiminOracle.MutationScoreExitPolicyProofs
            HoiminOracle.NestedTryFlowModel
            HoiminOracle.OutputRetentionProofs
            HoiminOracle.ProcessOutputProofs
            HoiminOracle.ProgressDecisionProofs
            HoiminOracle.Proofs
            HoiminOracle.ReportSequenceProofs
            HoiminOracle.ResultLifecycleProofs
            HoiminOracle.SchemaMigrationProofs
            HoiminOracle.ScopeResolutionProofs
            HoiminOracle.SessionProofs
            HoiminOracle.ShutdownProofs
            HoiminOracle.TimeoutLimitProofs
            HoiminOracle.TopBudgetProjectionProofs
            HoiminOracle.WorkspaceProofs
            HoiminOracle.AnnotationScopeProofs
            HoiminOracle.BindingFlowCases
            HoiminOracle.BoundedCandidateDiscoveryCases
            HoiminOracle.BudgetCases
            HoiminOracle.CandidateRankingCases
            HoiminOracle.CandidateSpanCases
            HoiminOracle.ChangedTargetCases
            HoiminOracle.ChangedContextCases
            HoiminOracle.CleanupCapabilityCases
            HoiminOracle.CompoundPatternGuardProofs
            HoiminOracle.DiskGuardProofs
            HoiminOracle.ExceptStarFlowModel
            HoiminOracle.ExceptionMatchBindingProofs
            HoiminOracle.MultipleHandlerJoinModel
            HoiminOracle.MutationScoreExitPolicyCases
            HoiminOracle.NestedMatchExitModel
            HoiminOracle.NestedTryFlowProofs
            HoiminOracle.OutputRetentionCases
            HoiminOracle.ProcessOutputCases
            HoiminOracle.ProgressDecisionCases
            HoiminOracle.ReportSequenceCases
            HoiminOracle.ResultLifecycleCases
            HoiminOracle.SchemaMigrationCases
            HoiminOracle.SessionCases
            HoiminOracle.ShutdownCases
            HoiminOracle.TimeoutLimitCases
            HoiminOracle.TopBudgetProjectionCases
            HoiminOracle.WorkspaceCases
            Main
            BindingFlowAuditMain
            HoiminOracle.ComprehensionBindingModel
            ComprehensionBindingAuditMain
            BoundedCandidateDiscoveryAuditMain
            BudgetMain
            CandidateRankingAuditMain
            CandidateSpanAuditMain
            ChangedTargetAuditMain
            ChangedContextAuditMain
            CleanupCapabilityAuditMain
            DiskGuardAuditMain
            HoiminOracle.AnnotationScopeCases
            HoiminOracle.CompoundPatternGuardCases
            HoiminOracle.ExceptStarFlowProofs
            HoiminOracle.ExceptionMatchBindingCases
            HoiminOracle.MultipleHandlerJoinProofs
            HoiminOracle.NestedMatchExitProofs
            HoiminOracle.NestedTryFlowCases
            MutationScoreExitPolicyAuditMain
            OutputRetentionAuditMain
            ProcessOutputAuditMain
            ProgressDecisionAuditMain
            HoiminOracle.ProgressInputModel
            HoiminOracle.ProgressInputProofs
            HoiminOracle.ProgressInputCases
            ProgressInputAuditMain
            ReportSequenceAuditMain
            ResultLifecycleAuditMain
            SchemaMigrationAuditMain
            SessionAuditMain
            ShutdownAuditMain
            TimeoutLimitAuditMain
            TopBudgetProjectionAuditMain
            WorkspaceAuditMain
            AnnotationScopeAuditMain
            PreparedNamespaceAuditMain
            CompoundPatternGuardAuditMain
            ExceptionMatchBindingAuditMain
            HoiminOracle.ExceptStarFlowCases
            HoiminOracle.MultipleHandlerJoinCases
            HoiminOracle.NestedMatchExitCases
            NestedTryFlowAuditMain
            HoiminOracle.ImplicitFinallyModel
            ImplicitFinallyAuditMain
            ExceptStarFlowAuditMain
            HoiminOracle.PerformanceCostModel
            HoiminOracle.PerformanceCostProofs
            HoiminOracle.PerformanceCostCases
            PerformanceCostAuditMain
            HoiminOracle.CollectionAnnotationModel
            CollectionAnnotationAuditMain
            HoiminOracle.ValidPythonModel
            ValidPythonAuditMain
            HoiminOracle.WithSuppressionModel
            WithSuppressionAuditMain
            HoiminOracle.DeferredAnnotationModel
            DeferredAnnotationAuditMain
            HoiminOracle.EvaluationOrderModel
            EvaluationOrderAuditMain
            HoiminOracle.DeclarationOnlyModel
            DeclarationOnlyAuditMain
            HoiminOracle.ResumeCopyModel
            ResumeCopyAuditMain
            HoiminOracle.NullableGateModel
            NullableGateAuditMain
            HoiminOracle
            MultipleHandlerJoinAuditMain
            NestedMatchExitAuditMain
          )
          for module in "${modules[@]}"; do
            run_guard "build-${module//./-}" lake build "+${module}:o"
          done
          run_guard build-library lake build HoiminOracle
          run_guard resource-cleanup \
            lake env lean -j1 -DElab.async=false --run ResourceCleanupAuditMain.lean 4

          generators=(
            'generate|corpus/state-machine.jsonl|check-only'
            'generate_budget|corpus/budget-cleanup.jsonl|check-only'
            'generate_session|corpus/session-recovery.jsonl|sensitivity'
            'generate_shutdown|corpus/shutdown-orchestration.jsonl|sensitivity'
            'generate_workspace|corpus/workspace-lifecycle.jsonl|check-only'
            'generate_result_lifecycle|corpus/result-lifecycle.jsonl|sensitivity'
            'generate_candidate_ranking|corpus/candidate-ranking.jsonl|sensitivity'
            'generate_schema_migration|corpus/schema-migration-concurrency.jsonl|sensitivity'
            'generate_binding_flow|corpus/binding-flow-joins.jsonl|sensitivity'
            'generate_annotation_scope|corpus/annotation-scope-correspondence.jsonl|sensitivity'
            'generate_exception_match_binding|corpus/exception-match-binding-correspondence.jsonl|sensitivity'
            'generate_top_budget_projection|corpus/top-budget-projection.jsonl|sensitivity'
            'generate_progress_decision|corpus/progress-decision.jsonl|sensitivity'
            'generate_progress_input|corpus/progress-input.jsonl|sensitivity'
            'generate_nested_try_flow|corpus/nested-try-flow.jsonl|sensitivity'
            'generate_nested_match_exits|corpus/nested-match-exits.jsonl|sensitivity'
            'generate_multiple_handler_joins|corpus/multiple-handler-joins.jsonl|sensitivity'
            'generate_report_sequence|corpus/report-sequence.jsonl|sensitivity'
            'generate_compound_pattern_guards|corpus/compound-pattern-guards.jsonl|sensitivity'
            'generate_except_star_flow|corpus/except-star-flow.jsonl|sensitivity'
            'generate_bounded_candidate_discovery|corpus/bounded-candidate-discovery.jsonl|sensitivity'
            'generate_mutation_score_exit_policy|corpus/mutation-score-exit-policy.jsonl|sensitivity'
            'generate_output_retention|corpus/output-retention.jsonl|sensitivity'
            'generate_candidate_span|corpus/candidate-span-preservation.jsonl|sensitivity'
            'generate_changed_target|corpus/changed-target-composition.jsonl|sensitivity'
            'generate_process_output|corpus/process-output-outcome.jsonl|sensitivity'
            'generate_timeout_limit|corpus/timeout-limit.jsonl|sensitivity'
            'generate_disk_guard|corpus/disk-guard-lifecycle.jsonl|sensitivity'
            'generate_cleanup_capability|corpus/cleanup-capability.jsonl|sensitivity'
            'generate_comprehension_bindings|corpus/comprehension-bindings.jsonl|sensitivity'
            'generate_performance_cost|corpus/performance-cost.jsonl|sensitivity'
            'generate_valid_python|corpus/valid-python.jsonl|sensitivity'
            'generate_collection_annotation|corpus/collection-annotation.jsonl|sensitivity'

            'generate_implicit_finally|corpus/implicit-finally.jsonl|sensitivity'
            'generate_with_suppression|corpus/with-suppression.jsonl|sensitivity'
            'generate_deferred_annotation|corpus/deferred-annotation.jsonl|sensitivity'
            'generate_evaluation_order|corpus/evaluation-order.jsonl|sensitivity'
            'generate_declaration_only|corpus/declaration-only.jsonl|sensitivity'
            'generate_resume_copy|corpus/resume-copy.jsonl|sensitivity'
            'generate_nullable_gate|corpus/nullable-gate.jsonl|sensitivity'
            'generate_prepared_namespace|corpus/prepared-namespace.jsonl|sensitivity'
            'generate_changed_context|corpus/changed-context.jsonl|sensitivity'
          )
          for entry in "${generators[@]}"; do
            IFS='|' read -r executable corpus sensitivity <<< "$entry"
            run_guard "check-$executable" \
              lake exe "$executable" -- --check "$corpus"
            if [[ "$sensitivity" == sensitivity ]]; then
              run_guard "sensitivity-$executable" \
                lake exe "$executable" -- --sensitivity
            fi
          done
      - name: Upload Lean resource statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-audit-stats
          path: ${{ runner.temp }}/lean-audit
          if-no-files-found: warn
          retention-days: 7

  boundary-contracts:
    needs: lean-audit
    name: Cross-boundary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: rustup toolchain install
      - run: uv sync --frozen
      - name: Adapter shape and runner classification
        run: |
          python -m unittest discover -s tests -p test_boundary_contracts.py -v
          cargo test -p hoimin-cli --test lean_progress_input_oracle shared_reader_fixture_encodings_preserve_fields_and_projection_premises -- --exact
      - name: Strict implemented boundary cases
        run: python tools/boundary_contracts.py strict --output "${{ runner.temp }}/boundary-contracts"
      - name: Report every case including unavailable premises
        if: always()
        run: python tools/boundary_contracts.py report --from-results "${{ runner.temp }}/boundary-contracts/strict.json" --output "${{ runner.temp }}/boundary-contracts"
      - name: Minimal result-validation witness
        if: always()
        env:
          HOIMIN_BOUNDARY_CASE: result_killed_exit_zero_complete
        run: cargo test -p hoimin-cli --test lean_progress_input_oracle shared_reader_progress_formats_follow_lean -- --exact --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: boundary-contracts
          path: ${{ runner.temp }}/boundary-contracts
          if-no-files-found: warn

  rust-shuffle:
    needs: quality
    name: Rust randomized order (nightly-2026-07-27)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-07-27 --profile minimal
      - run: uv sync --frozen
      - name: Run Rust tests in randomized order
        run: cargo +nightly-2026-07-27 test --workspace -- -Z unstable-options --shuffle

  contracts:
    needs: quality
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo test -p hoimin-core --features contracts
      - run: cargo test -p hoimin-cli --features contracts

  core-dependency-purity:
    needs: quality
    name: Core dependency purity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Reject I/O dependencies in hoimin-core
        shell: bash
        run: |
          cargo tree -p hoimin-core --edges normal --prefix none > core-tree.txt
          ! grep -E '(^| )(tokio|rusqlite|tempfile|windows-sys|libc|hoimin-cli)( |$)' core-tree.txt

  wheel-smoke:
    needs: quality
    name: Wheel smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv run --frozen pytest
      - name: Reset wheel artifact directory
        run: python -c "import shutil; shutil.rmtree('target/wheels', ignore_errors=True)"
      - run: uvx maturin build --release
      - run: uv run --frozen python tests/wheel_smoke.py

  linux-best-effort:
    needs: quality
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo test -p hoimin-cli --test process_handler linux_policy::unavailable_cgroup_requires_explicit_best_effort_opt_in -- --exact

  linux-cgroup-v2-hard:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOIMIN_CGROUP_V2_DELEGATED == 'true'
    runs-on: [self-hosted, linux, x64, cgroup-v2-delegated]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - name: Require delegated cgroup v2 hard tests to run
        shell: bash
        run: |
          set -o pipefail
          cargo test -p hoimin-cli --test process_handler cgroup_v2:: -- --nocapture 2>&1 | tee cgroup-v2.log
          ! grep -Fq 'SKIP:' cgroup-v2.log
