name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.plan.outputs.python }}
      rust: ${{ steps.plan.outputs.rust }}
      formal: ${{ steps.plan.outputs.formal }}
      creusot: ${{ steps.plan.outputs.creusot }}
      distribution: ${{ steps.plan.outputs.distribution }}
      cgroup: ${{ steps.plan.outputs.cgroup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Select checks conservatively
        id: plan
        env:
          CI_CGROUP: ${{ vars.HOIMIN_CGROUP_V2_DELEGATED }}
        run: python tools/ci_selection.py plan

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --group workflow --no-install-project
      - run: uv run --frozen --no-sync python -m tools.workflow_lint
      - run: uv run --frozen --no-sync pytest tests/test_workflow_lint.py tests/test_ci_selection.py tests/test_ci_selection_workflow.py tests/test_ci_metrics.py tests/test_verify_creusot.py tests/test_verify_quint.py tests/test_verify_quint_connect.py tests/test_lean_resource_guard.py

  quality:
    needs: changes
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --group fuzz --no-install-project
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync ruff check --no-fix .
      - run: uv run --frozen --no-sync ty check
      - name: Release SBOM generative tests
        run: uv run --frozen --no-sync pytest tests/test_sbom_properties.py tests/test_sbom_oracle.py
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        run: rustup toolchain install
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path vendor/ruff_python_parser/Cargo.toml -- --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked -p ruff_python_parser --lib --no-deps -- -D warnings

  fuzz:
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    name: Fuzz (bounded)
    runs-on: ubuntu-latest
    # Recent longest test jobs took 11m18s–12m09s; 11m is approximately 91–98%.
    timeout-minutes: 11
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Start fuzz budget including setup
        run: echo "FUZZ_DEADLINE=$(( $(date +%s) + 600 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - name: Cache cargo-fuzz executable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-fuzz-tool
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-0.13.2-nightly-2026-10-08
      - name: Install cargo-fuzz within remaining budget
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-fuzz-tool"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          if [[ ! -x "$tool_root/bin/cargo-fuzz" ]]; then
            remaining=$(( FUZZ_DEADLINE - $(date +%s) ))
            if (( remaining <= 0 )); then
              echo "Fuzz budget exhausted during setup" >&2
              exit 1
            fi
            timeout "${remaining}s" cargo +nightly-2026-10-08 install cargo-fuzz \
              --version 0.13.2 --locked --root "$tool_root"
          fi
      - name: Restore and retain discovered corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ runner.os }}-
      - name: Build, generate Python inputs, and fuzz all targets
        run: >-
          python tools/ci_fuzz.py
          --deadline "$FUZZ_DEADLINE"
          --report "$RUNNER_TEMP/fuzz-report"
          --seed "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fuzz-report
          path: |
            ${{ runner.temp }}/fuzz-report
            fuzz/artifacts
          retention-days: 7

  rust:
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    name: Rust (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.14', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo test --workspace
      - run: cargo test --locked -p hoimin-cli --example generate_cli_reference
      - name: Check generated CLI reference
        run: cargo run --locked -p hoimin-cli --example generate_cli_reference -- --check
      - name: Performance shape gates
        shell: bash
        run: python tools/performance_shapes.py gate --output "$RUNNER_TEMP/performance-gates"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: performance-gates-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/performance-gates
      - run: uv run --frozen pytest tests/test_skills.py

  creusot:
    name: Creusot production proofs
    needs: changes
    if: needs.changes.outputs.creusot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Start complete setup and proof measurement
        shell: bash
        run: |
          echo "CREUSOT_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/creusot-report"
          echo "job_start_epoch=$(date +%s)" > "$RUNNER_TEMP/creusot-report/setup.txt"
          test "$(uname -m)" = x86_64
          df -k "$RUNNER_TEMP"
          free -k
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned tool image cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/creusot-image.tar
          key: creusot-amd64-${{ hashFiles('formal/creusot/Dockerfile', 'formal/creusot/toolchain.json', 'formal/creusot/install*.sh', 'formal/creusot/configure.sh', 'formal/creusot/why3find.json', 'formal/creusot/why3.conf', 'formal/creusot/creusot_why3.conf', 'tools/creusot_environment.py') }}
      - name: Load or build pinned tool image
        shell: bash
        env:
          CREUSOT_CACHE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CREUSOT_CACHE_HIT" == 'true' ]]; then
            docker load -i "$RUNNER_TEMP/creusot-image.tar"
          else
            tar -cf - formal/creusot tools/creusot_environment.py |
              docker build --platform linux/amd64 --progress=plain \
                -f formal/creusot/Dockerfile -t hoimin-issue999-creusot:local -
            docker save -o "$RUNNER_TEMP/creusot-image.tar" hoimin-issue999-creusot:local
          fi
          docker image inspect hoimin-issue999-creusot:local --format '{{.Size}}'
      - name: Save pinned tool image cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/creusot-image.tar
          key: creusot-amd64-${{ hashFiles('formal/creusot/Dockerfile', 'formal/creusot/toolchain.json', 'formal/creusot/install*.sh', 'formal/creusot/configure.sh', 'formal/creusot/why3find.json', 'formal/creusot/why3.conf', 'formal/creusot/creusot_why3.conf', 'tools/creusot_environment.py') }}
      - name: Prove all production targets afresh
        shell: bash
        env:
          CREUSOT_CACHE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creusot-report"
          echo "cache_hit=$CREUSOT_CACHE_HIT" >> "$RUNNER_TEMP/creusot-report/setup.txt"
          docker run --rm --platform linux/amd64 hoimin-issue999-creusot:local uname -m | grep -qx x86_64
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" -v "$RUNNER_TEMP/creusot-report:/proof-report" \
            -e CARGO_TARGET_DIR=/tmp/hoimin-issue999-target -e CARGO_BUILD_JOBS=2 \
            --workdir /workspace hoimin-issue999-creusot:local \
            python3 tools/verify_creusot.py --output /proof-report
      - name: Record complete resource measurements
        if: always()
        shell: bash
        run: |
          echo "Elapsed setup plus proof seconds: $(( $(date +%s) - CREUSOT_JOB_START ))"
          if [[ -d "$RUNNER_TEMP/creusot-report" ]]; then
            {
              echo "job_elapsed_seconds=$(( $(date +%s) - CREUSOT_JOB_START ))"
              df -k "$RUNNER_TEMP"
              free -k
            } >> "$RUNNER_TEMP/creusot-report/setup.txt"
          fi
          df -k "$RUNNER_TEMP"
          free -k
          du -sk "$RUNNER_TEMP/creusot-report" "$RUNNER_TEMP/creusot-image.tar" 2>/dev/null || true
      - name: Upload proof measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: creusot-proof-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/creusot-report
          if-no-files-found: warn
          retention-days: 7
      - name: Upload proof diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: creusot-proof-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/creusot-report
          if-no-files-found: warn
          retention-days: 7

  quint:
    name: Quint and TLC
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    # The finite registry takes about 10 minutes before Connect and Rust replay.
    timeout-minutes: 25
    env:
      QUINT_HOME: ${{ github.workspace }}/formal/quint/_build/toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install
      - run: npm ci --prefix formal/quint --ignore-scripts --no-audit --no-fund
      - name: Cache pinned TLA toolchain
        id: tla-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QUINT_HOME }}/apalache-dist-0.62.4
          key: quint-apalache-0.62.4-8ac8488422c30d552735bae11b92a2d014d8e02e8608702acc08f9a2d8a9abb2
      - name: Install verified TLA toolchain before model-checking budget
        if: steps.tla-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apalache.tgz"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/apalache-mc/apalache/releases/download/v0.62.4/apalache.tgz \
            --output "$archive"
          printf '%s  %s\n' 8ac8488422c30d552735bae11b92a2d014d8e02e8608702acc08f9a2d8a9abb2 "$archive" | sha256sum --check --strict
          mkdir -p "$QUINT_HOME/apalache-dist-0.62.4"
          tar -xzf "$archive" -C "$QUINT_HOME/apalache-dist-0.62.4"
      - name: Check finite model, negative control, and oracle freshness
        run: python -u tools/verify_quint.py
      - name: Check live Quint Connect correspondence and generated seeds
        run: python tools/verify_quint_connect.py
      - name: Replay SQLite lifecycle and resume selection histories
        run: cargo test --locked -p hoimin-cli --test quint_session
      - name: Replay model traces and check generated histories
        run: cargo test --locked -p hoimin-core --test quint_budget --test budget_model --test quint_itf --test quint_report --test report_model --test quint_disk --test quint_disk_observation --test disk_model --test quint_stop --test stop_model --test quint_workers --test workers_model
      - name: Check internal completion-ledger correspondence
        run: cargo test --locked -p hoimin-core --lib machine::quint_completion
      - name: Replay public candidate-loading protocols
        run: cargo test --locked -p hoimin-core --test machine quint_
      - name: Check cleanup admission and actual OS ownership
        run: |
          cargo test --locked -p hoimin-cli --lib shell::finalization::quint
          cargo test --locked -p hoimin-cli --lib session::ownership::quint
          cargo test --locked -p hoimin-cli --lib workspace::owned::janitor::quint
          cargo test --locked -p hoimin-cli --lib shell::tests::quint_startup_janitor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quint-verification
          path: |
            formal/quint/_build/*.log
            formal/quint/_build/*.stats.json
          retention-days: 7

  lean-audit:
    needs: [changes, quality]
    if: needs.changes.outputs.formal == 'true'
    name: Lean audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            formal/HoiminOracle/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/HoiminOracle/lean-toolchain', 'formal/HoiminOracle/lakefile.toml', 'formal/HoiminOracle/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if ! command -v elan >/dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --location \
              https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
              --output "$RUNNER_TEMP/elan.tar.gz"
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          fi
          elan run --install "$(cat formal/HoiminOracle/lean-toolchain)" lean --version
      - name: Run bounded Lean audit
        working-directory: formal/HoiminOracle
        shell: bash
        run: |
          set -euo pipefail
          stats_dir="$RUNNER_TEMP/lean-audit"
          mkdir -p "$stats_dir"

          run_guard() {
            local name="$1"
            shift
            python3 tools/lean_resource_guard.py \
              --timeout-seconds 30 \
              --rss-limit-mib 2048 \
              --sample-ms 250 \
              --stats "$stats_dir/$name.json" \
              -- "$@"
          }

          modules=(
            HoiminOracle.ReduceSpecModel
            HoiminOracle.ReduceSpecProofs
            HoiminOracle.ReduceSpecCases
            ReduceSpecAuditMain
            HoiminOracle.SurvivorReviewModel
            HoiminOracle.SurvivorReviewProofs
            HoiminOracle.SurvivorReviewCases
            HoiminOracle.ReviewSourceModel
            HoiminOracle.ReviewSourceCases
            HoiminOracle.ReviewReportAdmissionModel
            HoiminOracle.ReviewReportAdmissionCases
            HoiminOracle.ReviewStoreDestinationModel
            HoiminOracle.ReviewStoreDestinationCases
            HoiminOracle.ReviewListingModel
            HoiminOracle.ReviewListingCases
            HoiminOracle.ReviewRecordModel
            HoiminOracle.ReviewRecordCases
            HoiminOracle.ReviewStorePublicationModel
            HoiminOracle.ReviewStorePublicationCases
            HoiminOracle.ReviewStoreAdmissionModel
            HoiminOracle.ReviewStoreAdmissionCases
            HoiminOracle.ReviewStoreSnapshotModel
            HoiminOracle.ReviewStoreSnapshotCases
            SurvivorReviewAuditMain
            HoiminOracle.SamplingModel
            HoiminOracle.BindingFlowModel
            HoiminOracle.BoundedCandidateDiscoveryModel
            HoiminOracle.BudgetModel
            HoiminOracle.CandidateRankingModel
            HoiminOracle.PagingModel
            HoiminOracle.LineDiverseModel
            HoiminOracle.MethodCallRemoveModel
            HoiminOracle.FunctionReturnConstantModel
            HoiminOracle.SourceOrderModel
            HoiminOracle.CandidateSpanModel
            HoiminOracle.ChangedTargetModel
            HoiminOracle.ChangedContextModel
            HoiminOracle.ChangedLinesModel
            HoiminOracle.GlobSelectionModel
            HoiminOracle.CleanupCapabilityModel
            HoiminOracle.EmptyDirectoryModel
            HoiminOracle.DiskGuardModel
            HoiminOracle.FactIndexModel
