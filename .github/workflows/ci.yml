            'generate_progress_decision|corpus/progress-decision.jsonl|sensitivity'
            'generate_progress_input|corpus/progress-input.jsonl|sensitivity'
            'generate_nested_try_flow|corpus/nested-try-flow.jsonl|sensitivity'
            'generate_nested_match_exits|corpus/nested-match-exits.jsonl|sensitivity'
            'generate_multiple_handler_joins|corpus/multiple-handler-joins.jsonl|sensitivity'
            'generate_report_sequence|corpus/report-sequence.jsonl|sensitivity'
            'generate_compound_pattern_guards|corpus/compound-pattern-guards.jsonl|sensitivity'
            'generate_except_star_flow|corpus/except-star-flow.jsonl|sensitivity'
            'generate_bounded_candidate_discovery|corpus/bounded-candidate-discovery.jsonl|sensitivity'
            'generate_mutation_score_exit_policy|corpus/mutation-score-exit-policy.jsonl|sensitivity'
            'generate_output_retention|corpus/output-retention.jsonl|sensitivity'
            'generate_candidate_span|corpus/candidate-span-preservation.jsonl|sensitivity'
            'generate_changed_target|corpus/changed-target-composition.jsonl|sensitivity'
            'generate_changed_context|corpus/changed-context.jsonl|sensitivity'
            'generate_changed_lines|corpus/changed-lines.jsonl|sensitivity'
            'generate_process_output|corpus/process-output-outcome.jsonl|sensitivity'
            'generate_timeout_limit|corpus/timeout-limit.jsonl|sensitivity'
            'generate_disk_guard|corpus/disk-guard-lifecycle.jsonl|sensitivity'
            'generate_cleanup_capability|corpus/cleanup-capability.jsonl|sensitivity'
            'generate_empty_directory|corpus/empty-directory.jsonl|sensitivity'
            'generate_comprehension_bindings|corpus/comprehension-bindings.jsonl|sensitivity'
            'generate_performance_cost|corpus/performance-cost.jsonl|sensitivity'
            'generate_valid_python|corpus/valid-python.jsonl|sensitivity'
            'generate_collection_annotation|corpus/collection-annotation.jsonl|sensitivity'

            'generate_implicit_finally|corpus/implicit-finally.jsonl|sensitivity'
            'generate_with_suppression|corpus/with-suppression.jsonl|sensitivity'
            'generate_deferred_annotation|corpus/deferred-annotation.jsonl|sensitivity'
            'generate_evaluation_order|corpus/evaluation-order.jsonl|sensitivity'
            'generate_declaration_only|corpus/declaration-only.jsonl|sensitivity'
            'generate_resume_copy|corpus/resume-copy.jsonl|sensitivity'
            'generate_nullable_gate|corpus/nullable-gate.jsonl|sensitivity'
            'generate_prepared_namespace|corpus/prepared-namespace.jsonl|sensitivity'
            'generate_paging|corpus/paging.jsonl|sensitivity'
            'generate_line_diverse|corpus/line-diverse.jsonl|sensitivity'
            'generate_method_call_remove|corpus/method-call-remove.jsonl|sensitivity'
            'generate_function_return_constant|corpus/function-return-constant.jsonl|sensitivity'
            'generate_prepared_annotation_import|corpus/prepared-annotation-import.jsonl|sensitivity'
            'generate_private_annotation_import|corpus/private-annotation-import.jsonl|sensitivity'
            'generate_environment_fingerprint|corpus/environment-fingerprint.jsonl|sensitivity'
            'generate_resume_diagnostic|corpus/resume-diagnostic.jsonl|sensitivity'
            'generate_exception_hierarchy|corpus/exception-hierarchy.jsonl|sensitivity'
            'generate_sampling|corpus/sampling.jsonl|sensitivity'
          )
          for entry in "${generators[@]}"; do
            IFS='|' read -r executable corpus sensitivity <<< "$entry"
            run_guard "check-$executable" \
              lake exe "$executable" -- --check "$corpus"
            if [[ "$sensitivity" == sensitivity ]]; then
              run_guard "sensitivity-$executable" \
                lake exe "$executable" -- --sensitivity
            fi
          done
      - name: Verify release SBOM model and corpus
        working-directory: formal/HoiminOracle
        run: |
          python3 tools/lean_resource_guard.py --timeout-seconds 20 --rss-limit-mib 2048 --sample-ms 250 \
            --stats "$RUNNER_TEMP/lean-audit/release-sbom.json" \
            -- lake env lean --run ReleaseSbom.lean > "$RUNNER_TEMP/release-sbom-gate.csv"
          diff -u ../../tests/fixtures/release-sbom-gate.csv "$RUNNER_TEMP/release-sbom-gate.csv"
      - name: Upload Lean resource statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-audit-stats
          path: ${{ runner.temp }}/lean-audit
          if-no-files-found: warn
          retention-days: 7

  boundary-contracts:
    needs: [changes, lean-audit]
    if: needs.changes.outputs.formal == 'true'
    name: Cross-boundary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: rustup toolchain install
      - run: uv sync --frozen
      - name: Adapter shape and runner classification
        run: |
          uv run --frozen --no-sync pytest tests/test_boundary_contracts.py -v
          cargo test -p hoimin-cli --test lean_progress_input_oracle shared_reader_fixture_encodings_preserve_fields_and_projection_premises -- --exact
      - name: Strict implemented boundary cases
        run: python tools/boundary_contracts.py strict --output "$RUNNER_TEMP/boundary-contracts"
      - name: Report every case including unavailable premises
        if: always()
        run: python tools/boundary_contracts.py report --from-results "$RUNNER_TEMP/boundary-contracts/strict.json" --output "$RUNNER_TEMP/boundary-contracts"
      - name: Minimal result-validation witness
        if: always()
        env:
          HOIMIN_BOUNDARY_CASE: result_killed_exit_zero_complete
        run: cargo test -p hoimin-cli --test lean_progress_input_oracle shared_reader_progress_formats_follow_lean -- --exact --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: boundary-contracts
          path: ${{ runner.temp }}/boundary-contracts
          if-no-files-found: warn

  rust-shuffle:
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    name: Rust randomized order (nightly-2026-10-08)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - run: uv sync --frozen
      - name: Run Rust tests in randomized order
        run: cargo +nightly-2026-10-08 test --workspace -- -Z unstable-options --shuffle

  contracts:
    name: Contracts
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo test -p hoimin-core --features contracts
      - run: cargo test -p hoimin-cli --features contracts

  core-dependency-purity:
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    name: Core dependency purity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Reject I/O dependencies in hoimin-core
        shell: bash
        run: |
          cargo tree -p hoimin-core --edges normal --prefix none > core-tree.txt
          ! grep -E '(^| )(tokio|rusqlite|tempfile|windows-sys|libc|hoimin-cli)( |$)' core-tree.txt

  wheel-smoke:
    needs: [changes, quality]
    if: needs.changes.outputs.distribution == 'true' || needs.changes.outputs.python == 'true'
    name: Wheel smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv run --frozen pytest
      - name: Reset wheel artifact directory
        run: python -c "import shutil; shutil.rmtree('target/wheels', ignore_errors=True)"
      - run: uvx maturin build --release
      - run: uv sync --frozen --no-install-project
      - run: uv run --frozen --no-sync python tests/wheel_smoke.py

  linux-best-effort:
    name: Linux best effort
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo test -p hoimin-cli --test process_handler linux_policy::unavailable_cgroup_requires_explicit_best_effort_opt_in -- --exact

  linux-cgroup-v2-hard:
    name: Linux cgroup v2 hard
    needs: [changes, quality]
    if: needs.changes.outputs.cgroup == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOIMIN_CGROUP_V2_DELEGATED == 'true'
    # Trusted main push only, explicit delegated-cgroup opt-in; never PR code.
    runs-on: [self-hosted, linux, x64, cgroup-v2-delegated] # zizmor: ignore[self-hosted-runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - name: Require delegated cgroup v2 hard tests to run
        shell: bash
        run: |
          set -o pipefail
          cargo test -p hoimin-cli --test process_handler cgroup_v2:: -- --nocapture 2>&1 | tee cgroup-v2.log
          ! grep -Fq 'SKIP:' cgroup-v2.log

  result:
    name: CI result
    if: always()
    needs: [changes, quality, workflow-lint, fuzz, rust, lean-audit, boundary-contracts, rust-shuffle, contracts, core-dependency-purity, wheel-smoke, linux-best-effort, linux-cgroup-v2-hard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Require selected jobs to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$CI_NEEDS" | python tools/ci_selection.py aggregate
