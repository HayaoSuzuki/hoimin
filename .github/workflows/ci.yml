name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.plan.outputs.python }}
      rust: ${{ steps.plan.outputs.rust }}
      formal: ${{ steps.plan.outputs.formal }}
      distribution: ${{ steps.plan.outputs.distribution }}
      cgroup: ${{ steps.plan.outputs.cgroup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Select checks conservatively
        id: plan
        env:
          CI_CGROUP: ${{ vars.HOIMIN_CGROUP_V2_DELEGATED }}
        run: python tools/ci_selection.py plan

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --group workflow --no-install-project
      - run: uv run --frozen --no-sync python -m tools.workflow_lint
      - run: uv run --frozen --no-sync pytest tests/test_workflow_lint.py tests/test_ci_selection.py tests/test_ci_selection_workflow.py tests/test_ci_metrics.py

  quality:
    needs: changes
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group fuzz --no-install-project
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync ruff check --no-fix .
      - run: uv run --frozen --no-sync ty check
      - name: Release SBOM generative tests
        run: uv run --frozen --no-sync pytest tests/test_sbom_properties.py tests/test_sbom_oracle.py
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        run: rustup toolchain install
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path vendor/ruff_python_parser/Cargo.toml -- --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked -p littrs-ruff-python-parser --lib --no-deps -- -D warnings

  fuzz:
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    name: Fuzz (bounded)
    runs-on: ubuntu-latest
    # Recent longest test jobs took 11m18s–12m09s; 11m is approximately 91–98%.
    timeout-minutes: 11
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Start fuzz budget including setup
        run: echo "FUZZ_DEADLINE=$(( $(date +%s) + 600 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - name: Cache cargo-fuzz executable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-fuzz-tool
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-0.13.2-nightly-2026-10-08
      - name: Install cargo-fuzz within remaining budget
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-fuzz-tool"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          if [[ ! -x "$tool_root/bin/cargo-fuzz" ]]; then
            remaining=$(( FUZZ_DEADLINE - $(date +%s) ))
            if (( remaining <= 0 )); then
              echo "Fuzz budget exhausted during setup" >&2
              exit 1
            fi
            timeout "${remaining}s" cargo +nightly-2026-10-08 install cargo-fuzz \
              --version 0.13.2 --locked --root "$tool_root"
          fi
      - name: Restore and retain discovered corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ runner.os }}-
      - name: Build, generate Python inputs, and fuzz all targets
        run: >-
          python tools/ci_fuzz.py
          --deadline "$FUZZ_DEADLINE"
          --report "$RUNNER_TEMP/fuzz-report"
          --seed "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fuzz-report
          path: |
            ${{ runner.temp }}/fuzz-report
            fuzz/artifacts
          retention-days: 7

  rust:
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    name: Rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: uv sync --frozen
      - run: cargo test --workspace
      - run: cargo test -p hoimin-cli --test run_e2e
      - name: Performance shape gates
        run: python tools/performance_shapes.py gate --output "$RUNNER_TEMP/performance-gates"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: performance-gates-${{ matrix.os }}
          path: ${{ runner.temp }}/performance-gates
      - run: uv run --frozen pytest tests/test_skills.py

  lean-audit:
    needs: [changes, quality]
    if: needs.changes.outputs.formal == 'true'
    name: Lean audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            formal/HoiminOracle/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/HoiminOracle/lean-toolchain', 'formal/HoiminOracle/lakefile.toml', 'formal/HoiminOracle/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if ! command -v elan >/dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --location \
              https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
              --output "$RUNNER_TEMP/elan.tar.gz"
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          fi
          elan run --install "$(cat formal/HoiminOracle/lean-toolchain)" lean --version
      - name: Run bounded Lean audit
        working-directory: formal/HoiminOracle
        shell: bash
        run: |
          set -euo pipefail
          stats_dir="$RUNNER_TEMP/lean-audit"
          mkdir -p "$stats_dir"

          run_guard() {
            local name="$1"
            shift
            python3 tools/lean_resource_guard.py \
              --timeout-seconds 30 \
              --rss-limit-mib 2048 \
              --sample-ms 250 \
              --stats "$stats_dir/$name.json" \
              -- "$@"
          }

          modules=(
            HoiminOracle.SamplingModel
            HoiminOracle.BindingFlowModel
            HoiminOracle.BoundedCandidateDiscoveryModel
            HoiminOracle.BudgetModel
            HoiminOracle.CandidateRankingModel
            HoiminOracle.PagingModel
            HoiminOracle.LineDiverseModel
            HoiminOracle.MethodCallRemoveModel
            HoiminOracle.FunctionReturnConstantModel
            HoiminOracle.SourceOrderModel
            HoiminOracle.CandidateSpanModel
            HoiminOracle.ChangedTargetModel
            HoiminOracle.ChangedContextModel
            HoiminOracle.ChangedLinesModel
            HoiminOracle.GlobSelectionModel
            HoiminOracle.CleanupCapabilityModel
            HoiminOracle.EmptyDirectoryModel
            HoiminOracle.DiskGuardModel
            HoiminOracle.FactIndexModel
            HoiminOracle.Model
            HoiminOracle.MutationScoreExitPolicyModel
            HoiminOracle.OutputRetentionModel
            HoiminOracle.ProcessOutputModel
            HoiminOracle.ProgressDecisionModel
            HoiminOracle.ReportSequenceModel
            HoiminOracle.ResourceCleanupModel
            HoiminOracle.ResultLifecycleModel
            HoiminOracle.SchemaMigrationModel
            HoiminOracle.ScopeResolutionModel
            HoiminOracle.SessionModel
            HoiminOracle.ShutdownModel
            HoiminOracle.TimeoutLimitModel
            HoiminOracle.TopBudgetProjectionModel
