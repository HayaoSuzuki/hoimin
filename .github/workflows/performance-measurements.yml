name: Performance measurements
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or branch
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: performance-measurements-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    name: Performance measurements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build candidate release
        run: cargo build --locked --release -p hoimin-cli --bin hoimin --jobs 2
      - name: Build baseline release
        working-directory: baseline
        run: cargo build --locked --release -p hoimin-cli --bin hoimin --jobs 2
      - name: Measure isolated CLI processes
        run: python tools/performance_shapes.py measure --baseline baseline/target/release/hoimin --candidate target/release/hoimin --output "$RUNNER_TEMP/performance-measurements"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: performance-measurements
          path: ${{ runner.temp }}/performance-measurements
