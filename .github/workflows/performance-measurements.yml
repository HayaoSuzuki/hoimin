name: Performance measurements
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or branch
        required: true
        default: main
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Build candidate release
        run: cargo build --locked --release -p hoimin-cli --bin hoimin --jobs 2
      - name: Build baseline release
        working-directory: baseline
        run: cargo build --locked --release -p hoimin-cli --bin hoimin --jobs 2
      - name: Measure isolated CLI processes
        run: python tools/performance_shapes.py measure --baseline baseline/target/release/hoimin --candidate target/release/hoimin --output "${{ runner.temp }}/performance-measurements"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-measurements
          path: ${{ runner.temp }}/performance-measurements
