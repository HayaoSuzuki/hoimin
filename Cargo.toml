[workspace]
members = ["crates/hoimin-core", "crates/hoimin-cli"]
exclude = ["vendor/ruff_python_parser"]
resolver = "3"

[patch.crates-io]
littrs-ruff-python-parser = { path = "vendor/ruff_python_parser" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Elastic-2.0"
repository = "https://github.com/tokyogas-tech/hoimin"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
strip = true
