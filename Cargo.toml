[workspace]
members = ["crates/hoimin-core", "crates/hoimin-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tokyogas-tech/hoimin"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
strip = true
