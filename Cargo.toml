[workspace]
members = ["crates/hoimin-budget-math", "crates/hoimin-core", "crates/hoimin-cli", "crates/hoimin-python"]
exclude = ["vendor/ruff_python_parser", "vendor/rstest_macros"]
resolver = "3"

[workspace.dependencies]
rstest = { version = "0.28", default-features = false }
ruff_python_parser = { path = "vendor/ruff_python_parser", features = ["stacker"] }
ruff_python_ast = "=0.0.21"
ruff_text_size = "=0.0.21"

[patch.crates-io]
# Preserve parameterized test body spans for source-based coverage.
rstest_macros = { path = "vendor/rstest_macros" }

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
repository = "https://github.com/HayaoSuzuki/hoimin"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)', 'cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
strip = true
