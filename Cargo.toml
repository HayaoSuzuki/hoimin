[workspace]
members = ["crates/hoimin-budget-math", "crates/hoimin-core", "crates/hoimin-cli", "crates/hoimin-python"]
exclude = ["vendor/ruff_python_parser"]
resolver = "3"

[workspace.dependencies]
ruff_python_parser = { path = "vendor/ruff_python_parser", features = ["stacker"] }
ruff_python_ast = "=0.0.19"
ruff_text_size = "=0.0.19"

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
repository = "https://github.com/HayaoSuzuki/hoimin"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
strip = true
