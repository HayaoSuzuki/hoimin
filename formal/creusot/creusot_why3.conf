[main]
magic = 14
running_provers_max = 2
memlimit = 2048
timelimit = 5.000000

[prover]
name = "Z3"
version = "5.1.0"
command = "/usr/bin/timeout --signal=KILL 30s /usr/bin/prlimit --as=2147483648 -- /opt/creusot/data/bin/z3 -smt2 -T:%t sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 -st %f"
driver = "z3_4_12"

[prover]
name = "CVC5"
version = "1.4.1"
command = "/usr/bin/timeout --signal=KILL 30s /usr/bin/prlimit --as=2147483648 -- /opt/creusot/data/bin/cvc5 --stats-internal --tlimit=%T %f"
driver = "cvc5"
