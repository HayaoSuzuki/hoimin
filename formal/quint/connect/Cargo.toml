[package]
name = "hoimin-quint-connect"
version = "0.0.0"
edition = "2024"
publish = false
license = "Elastic-2.0"

# The live Quint process belongs to an explicit verification job, not ordinary cargo test.
[workspace]
members = ["."]
resolver = "3"

[features]
contracts = ["hoimin-core/contracts"]

[dev-dependencies]
hoimin-core = { path = "../../../crates/hoimin-core" }
quint-connect = "=0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "arbitrary_precision"] }
itf = "0.4"
anyhow = "1.0"
proptest = "1.7"

rstest = { version = "0.28", default-features = false }

[patch.crates-io]
rstest_macros = { path = "../../../vendor/rstest_macros" }
