site_name: hoimin
site_url: https://hayaosuzuki.github.io/hoimin/
site_description: Bounded mutation testing for focused Python changes
repo_url: https://github.com/HayaoSuzuki/hoimin
edit_uri: ''
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: en
markdown_extensions:
  - fenced_code
  - tables
  - footnotes
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    absolute_links: warn
    anchors: warn
nav:
  - Getting started:
      - Installation and quick start: index.md
      - Product principles: docs/product-principles.md
      - Questions and bug reports: docs/support.md
      - License: docs/licensing.md
  - Usage and reference:
      - Usage: docs/usage.md
      - Agent skills: docs/agent-skills.md
      - CLI reference: docs/cli-reference.md
      - Compatibility: docs/compatibility.md
  - Maintainer development:
      - Development: docs/development.md
      - Documentation publication: docs/documentation.md
      - CI: docs/ci.md
      - Releases: docs/releases.md
      - PyPI publication: docs/pypi-publishing.md
      - Artifact smoke checks: docs/artifact-smoke.md
      - Dependency policy: docs/dependency-policy.md
      - Dependency build scripts: docs/dependency-build-scripts.md
