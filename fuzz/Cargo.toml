[package]
name = "hoimin-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Elastic-2.0"

[package.metadata]
cargo-fuzz = true

# Keep libFuzzer and its nightly build separate from the shipping workspace.
[workspace]
members = ["."]
resolver = "3"

[dependencies]
blake3 = "1.8"
hoimin-core = { path = "../crates/hoimin-core" }
hoimin-python = { path = "../crates/hoimin-python" }
libfuzzer-sys = ">=0.4, <1"
camino = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"

# The analyzer targets must use the same parser patch as the shipping workspace.
[patch.crates-io]
littrs-ruff-python-parser = { path = "../vendor/ruff_python_parser" }

[[bin]]
name = "source_encoding"
path = "fuzz_targets/source_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_index"
path = "fuzz_targets/source_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "candidate_validation"
path = "fuzz_targets/candidate_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "python_analyzer"
path = "fuzz_targets/python_analyzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_sequence"
path = "fuzz_targets/report_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "target_resolution"
path = "fuzz_targets/target_resolution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sampling"
path = "fuzz_targets/sampling.rs"
test = false
doc = false
bench = false
