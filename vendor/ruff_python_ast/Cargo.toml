# Ruff 0.17.2; upstream revision 30516b42ab972ffa2569e5efcfee81135da466d3.
# Workspace inheritance expanded for the hoimin source distribution.

[package]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE*", "README.hoimin.md", "build.rs", "data/*.txt", "data/LICENSE*"]
name = "ruff_python_ast"
version = "0.0.19"
description = "This is an internal component crate of Ruff"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>"]
edition = "2024"
rust-version = "1.97"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
license = "MIT"
autotests = false
autobenches = false
autoexamples = false

[workspace]

[lib]
path = "src/lib.rs"
test = false

[dependencies]
ruff_cache = { path = "../ruff_cache", optional = true }
ruff_macros = { path = "../ruff_macros", optional = true }
ruff_python_trivia = { path = "../ruff_python_trivia" }
ruff_source_file = { path = "../ruff_source_file" }
ruff_text_size = { path = "../ruff_text_size" }
aho-corasick = { version = "1.1.3", default-features = false, features = ["perf-literal", "std"] }
arrayvec = { version = "0.7.6", default-features = false }
bitflags = { version = "2.5.0", default-features = false }
char_str = { version = "0.0.4", default-features = false, features = ["std"] }
compact_str = { version = "0.10.0", default-features = false, features = ["std"] }
get-size2 = { version = "0.11.0", default-features = false, features = ["compact-str", "derive", "hashbrown", "ordermap", "smallvec", "std", "thin-vec"], optional = true }
is-macro = { version = "0.3.5", default-features = false }
memchr = { version = "2.7.1", default-features = false, features = ["std"] }
rustc-hash = { version = "2.0.0", default-features = false, features = ["std"] }
salsa = { version = "0.28.5", default-features = false, features = ["compact_str", "macros", "salsa_unstable", "inventory"], optional = true }
schemars = { version = "1.0.4", default-features = false, features = ["derive", "std"], optional = true }
serde = { version = "1.0.197", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0.113", default-features = false, features = ["std"], optional = true }
thiserror = { version = "2.0.0", default-features = false, features = ["std"] }
thin-vec = { version = "0.2.14", default-features = false, features = ["std"] }

[features]
schemars = ["dep:schemars", "dep:serde_json"]
cache = ["dep:ruff_cache", "dep:ruff_macros"]
serde = ["dep:serde", "ruff_text_size/serde", "dep:ruff_cache", "char_str/serde", "compact_str/serde", "thin-vec/serde"]
get-size = ["dep:get-size2", "char_str/get-size", "ruff_text_size/get-size"]
salsa = ["dep:salsa"]
