# Ruff 0.17.2; upstream revision 30516b42ab972ffa2569e5efcfee81135da466d3.
# Workspace inheritance expanded for the hoimin source distribution.

[package]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE*", "README.hoimin.md", "build.rs", "data/*.txt", "data/LICENSE*"]
name = "ruff_python_parser"
version = "0.0.19"
description = "This is an internal component crate of Ruff"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>", "RustPython Team"]
edition = "2024"
rust-version = "1.97"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
license = "MIT"
autotests = false
autobenches = false
autoexamples = false

[workspace]

[lib]
path = "src/lib.rs"
test = false

[dependencies]
ruff_python_ast = { path = "../ruff_python_ast", features = ["get-size"] }
ruff_python_trivia = { path = "../ruff_python_trivia" }
ruff_text_size = { path = "../ruff_text_size", features = ["get-size"] }
ruff_unicode_names2 = { path = "../ruff_unicode_names2" }
bitflags = { version = "2.5.0", default-features = false }
bstr = { version = "1.9.1", default-features = false, features = ["std"] }
drop_bomb = { version = "0.1.5", default-features = false }
get-size2 = { version = "0.11.0", default-features = false, features = ["compact-str", "derive", "hashbrown", "ordermap", "smallvec", "std", "thin-vec"] }
hashbrown = { version = "0.17.0", default-features = false, features = ["inline-more"] }
memchr = { version = "2.7.1", default-features = false, features = ["std"] }
rustc-hash = { version = "2.0.0", default-features = false, features = ["std"] }
static_assertions = { version = "1.1.0", default-features = false }
stacker = { version = "0.1.24", default-features = false, optional = true }
thin-vec = { version = "0.2.14", default-features = false, features = ["std"] }
unicode-ident = { version = "1.0.12", default-features = false }
unicode-normalization = { version = "0.1.23", default-features = false, features = ["std"] }

[features]
stacker = ["dep:stacker"]
default = ["stacker"]
