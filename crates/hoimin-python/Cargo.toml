[package]
name = "hoimin-python"
description = "Pure Python mutation analysis for hoimin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Logical payload observations for CLI tests; never enabled by normal dependencies.
test-support = []

[dependencies]
blake3 = "1.8"
camino = "1.1"
hoimin-core = { path = "../hoimin-core" }
num-bigint = ">=0.5.0, <1"
num-traits = ">=0.2.19, <1"
thiserror = "2.0"
# Keep Ruff types aligned with the parser's pinned upstream revision.
ruff_python_parser = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = { workspace = true }

[dev-dependencies]
proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
