[package]
name = "hoimin-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Logical payload observations for CLI tests; never enabled by normal dependencies.
test-support = []

[dependencies]
blake3 = "1.8"
camino = "1.1"
hoimin-core = { path = "../hoimin-core" }
num-bigint = "0.5.0"
num-traits = "0.2.19"
thiserror = "2.0"
ruff_python_parser = { version = "0.6.2", package = "littrs-ruff-python-parser" }
ruff_python_ast = { version = "0.6.2", package = "littrs-ruff-python-ast" }
ruff_text_size = { version = "0.6.2", package = "littrs-ruff-text-size" }

[dev-dependencies]
proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
