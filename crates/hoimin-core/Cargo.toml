[package]
name = "hoimin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
contracts = ["dep:contract_checks"]

[dependencies]
hoimin-budget-math = { path = "../hoimin-budget-math", features = ["serde"] }
contract_checks = { package = "contracts", version = ">=0.6.11, <1", optional = true }
blake3 = "1.8"
camino = { version = "1.1", features = ["serde1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.7"
