[package]
name = "hoimin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hoimin"
path = "src/main.rs"

[features]
default = []
contracts = ["hoimin-core/contracts"]

[dependencies]
blake3 = "1.8"
cap-fs-ext = "4.0"
cap-primitives = "4.0"
cap-std = "4.0.2"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
camino = "1.1"
crc32fast = "1.4"
fs2 = "0.4.3"
hoimin-core = { path = "../hoimin-core" }
humantime = "2.2"
ignore = "0.4"
num-bigint = "0.4.8"
num-traits = "0.2.19"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.17", features = ["v4"] }
ruff_python_parser = { version = "0.6.2", package = "littrs-ruff-python-parser" }
ruff_python_ast = { version = "0.6.2", package = "littrs-ruff-python-ast" }
ruff_text_size = { version = "0.6.2", package = "littrs-ruff-text-size" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
proptest = "1.7"
