name: hoimin-release-state-github
runtime: yaml
description: Release reservation branch protection for HayaoSuzuki/hoimin
backend:
  url: file://./state

resources:
  github:
    type: pulumi:providers:github
    options:
      version: 6.15.0
    properties:
      owner: HayaoSuzuki

  releaseState:
    type: github:index/repositoryRuleset:RepositoryRuleset
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
    properties:
      repository: hoimin
      name: hoimin-release-state-protection
      target: branch
      enforcement: active
      bypassActors: []
      conditions:
        refName:
          includes: [refs/heads/hoimin-release-state]
          excludes: []
      rules:
        deletion: true
        nonFastForward: true
        # The release workflow creates/advances this ref directly with an atomic
        # tag reservation. Require neither a PR nor status checks on this ref.

outputs:
  releaseStateRulesetId: ${releaseState.rulesetId}
